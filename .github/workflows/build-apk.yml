name: Build Ashen Realms APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Stamp mobile build version
        env:
          GAME_VERSION: "0.1.0"
        run: echo '{"game_version":"'$GAME_VERSION'","commit":"${{ github.sha }}","build":${{ github.run_number }}}' > public/version.json

      - name: Install dependencies
        run: npm install

      - name: Create bundled clean city image
        run: |
          python -m pip install --disable-pip-version-check pillow opencv-python-headless
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import cv2
          import numpy as np

          url = "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/5e1ebf60e4fb2011301965b7c1d1b755e0d8e781c67864e6e62e6a8d36766ec2.png"
          req = Request(url, headers={"User-Agent": "Mozilla/5.0"})
          data = urlopen(req, timeout=60).read()
          src = cv2.imdecode(np.frombuffer(data, np.uint8), cv2.IMREAD_COLOR)
          if src is None:
              raise RuntimeError("Could not decode source city image")
          if src.shape[1] != 1536 or src.shape[0] != 864:
              src = cv2.resize(src, (1536, 864), interpolation=cv2.INTER_LANCZOS4)

          mask = np.zeros(src.shape[:2], dtype=np.uint8)
          cv2.rectangle(mask, (175, 775), (500, 803), 255, -1)
          clean = cv2.inpaint(src, mask, 5, cv2.INPAINT_TELEA)

          out = Path("public/assets/city-clean.png")
          out.parent.mkdir(parents=True, exist_ok=True)
          if not cv2.imwrite(str(out), clean, [cv2.IMWRITE_PNG_COMPRESSION, 9]):
              raise RuntimeError("Could not write bundled city image")
          print(f"Bundled {out} ({out.stat().st_size} bytes)")
          PY

      - name: Add Android platform
        run: npx cap add android

      - name: Force landscape orientation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=s.replace('android:screenOrientation="unspecified"', 'android:screenOrientation="landscape"')
          if 'android:screenOrientation="landscape"' not in s:
              s=s.replace('<activity', '<activity android:screenOrientation="landscape"', 1)
          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Re-apply landscape orientation after Capacitor sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if 'android:screenOrientation="landscape"' not in s:
              s=s.replace('<activity', '<activity android:screenOrientation="landscape"', 1)
          else:
              s=s.replace('android:screenOrientation="unspecified"', 'android:screenOrientation="landscape"')
          p.write_text(s)
          PY

      - name: Verify bundled city image before build
        run: |
          test -f public/assets/city-clean.png
          file public/assets/city-clean.png

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify final APK contains the new city PNG
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -E 'assets/public/assets/city-clean\.png'
          SIZE=$(unzip -p "$APK" assets/public/assets/city-clean.png | wc -c)
          echo "Bundled city PNG bytes in APK: $SIZE"
          test "$SIZE" -gt 100000
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ashen-realms-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish mobile update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build.${{ github.run_number }}
          name: Ashen Realms Mobile 0.1.0 (build ${{ github.run_number }})
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
