name: Build Ashen Realms APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Stamp mobile build version
        env:
          GAME_VERSION: "0.1.0"
        run: echo '{"game_version":"'$GAME_VERSION'","commit":"${{ github.sha }}","build":${{ github.run_number }}}' > public/version.json

      - name: Install dependencies
        run: npm install

      - name: Restore user-provided kingdom image
        run: |
          test -f public/assets/city-user.jpg.b64
          base64 -d public/assets/city-user.jpg.b64 > public/assets/city-user.jpg
          rm public/assets/city-user.jpg.b64
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p = Path("public/assets/city-user.jpg")
          im = Image.open(p)
          print(f"User city image: {im.size}, {p.stat().st_size} bytes")
          assert im.size == (256, 144)
          assert p.stat().st_size > 100000
          PY

      - name: Add Android platform
        run: npx cap add android

      - name: Force landscape orientation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=s.replace('android:screenOrientation="unspecified"', 'android:screenOrientation="landscape"')
          if 'android:screenOrientation="landscape"' not in s:
              s=s.replace('<activity', '<activity android:screenOrientation="landscape"', 1)
          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Re-apply landscape orientation after Capacitor sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if 'android:screenOrientation="landscape"' not in s:
              s=s.replace('<activity', '<activity android:screenOrientation="landscape"', 1)
          else:
              s=s.replace('android:screenOrientation="unspecified"', 'android:screenOrientation="landscape"')
          p.write_text(s)
          PY

      - name: Verify user-provided city image before build
        run: |
          test -f public/assets/city-user.jpg
          file public/assets/city-user.jpg

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify final APK contains the user-provided city image
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -E 'assets/public/assets/city-user\.jpg'
          SIZE=$(unzip -p "$APK" assets/public/assets/city-user.jpg | wc -c)
          echo "Bundled city PNG bytes in APK: $SIZE"
          test "$SIZE" -gt 10000
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ashen-realms-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish mobile update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build.${{ github.run_number }}
          name: Ashen Realms Mobile 0.1.0 (build ${{ github.run_number }})
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
