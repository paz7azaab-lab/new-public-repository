<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeBridge AI Agent</title><style>body{font-family:system-ui;background:#f5f7fa;margin:0;padding:20px}.box{max-width:700px;margin:auto;background:#fff;padding:22px;border-radius:18px;box-shadow:0 8px 30px #0001}input,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border:1px solid #ddd;border-radius:10px}button{background:#111;color:#fff;font-weight:700}.card{margin-top:14px;padding:15px;border-radius:12px;background:#f1f3f5}.ok{background:#e8f7ed}.bad{background:#fff0f0}.small{font-size:13px;color:#666}</style></head><body><div class="box"><h1>🤖 TradeBridge AI Agent</h1><p>Demand → Supply → Profit → Trust | حالت آزمایشی</p><label>محصول / سفارش عمده</label><input id="p" placeholder="مثلاً زعفران عمده 100 کیلو"><label>قیمت تأمین ایران ($)</label><input id="s" type="number" value="1000"><label>قیمت فروش به خریدار ($)</label><input id="v" type="number" value="1800"><label>هزینه‌ای که ما واقعاً می‌پردازیم ($)</label><input id="c" type="number" value="0"><label>حداقل سود ($)</label><input id="m" type="number" value="300"><button onclick="run()">اجرای Agent</button><div id="r" class="card">آماده اجرا</div><p class="small">این نسخه فقط موتور تصمیم‌گیری سود را تست می‌کند؛ خرید، فروش و پرداخت واقعی انجام نمی‌دهد.</p></div><script>function run(){let p=document.getElementById('p').value||'سفارش عمده';let s=+document.getElementById('s').value,v=+document.getElementById('v').value,c=+document.getElementById('c').value,m=+document.getElementById('m').value;let profit=v-s-c,margin=s?profit/s*100:0;let ok=v>s&&profit>=m;let r=document.getElementById('r');r.className='card '+(ok?'ok':'bad');r.innerHTML='<b>'+(ok?'✅ فرصت قابل بررسی':'❌ فرصت رد شد')+'</b><br>محصول: '+p+'<br>سود خالص ما: $'+profit.toFixed(2)+'<br>حاشیه سود: '+margin.toFixed(1)+'%<br>تصمیم: '+(ok?'عبور از فیلتر سود':'عدم عبور از فیلتر سود');}</script></body></html>
