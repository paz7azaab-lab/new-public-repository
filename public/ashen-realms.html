<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;background:#071019;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}

#hCity{left:1%;top:31%;width:37%;height:27%}#hWorld{left:38%;top:31%;width:34%;height:27%}#hBattle{left:72%;top:31%;width:28%;height:27%}

.panel{position:fixed;inset:0;background:#050b11d9;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.panel.show{display:flex}.card{width:min(620px,96vw);max-height:90vh;overflow:auto;background:linear-gradient(145deg,#172635,#0a131c);border:1px solid #c59b53;border-radius:18px;padding:20px;box-shadow:0 25px 70px #000d}.card h2{margin:0 0 7px;color:#f2cf86}.muted{color:#bdc7cf;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}.tile{background:#0c1721;border:1px solid #ffffff18;border-radius:12px;padding:11px}.tile b{display:block;color:#f0d59b;margin-bottom:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.close{float:left}.bar{height:9px;background:#1b2a35;border-radius:99px;overflow:hidden;margin-top:6px}.fill{height:100%;width:70%;background:#c59b53}.log{margin-top:12px;padding:10px;border-radius:10px;background:#071019;border:1px solid #ffffff12;min-height:42px}
@media(max-width:650px){.resources{font-size:11px;gap:7px}.brand{font-size:12px}.top{align-items:flex-start}.bottom .btn{padding:8px 9px;font-size:12px}}

.profile-pick{position:fixed;inset:0;background:#03080edb;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.profile-pick.show{display:flex}.profile-card{width:min(760px,96vw);max-height:92vh;overflow:auto;background:linear-gradient(145deg,#182938,#08121b);border:1px solid #c59b53;border-radius:22px;padding:20px;box-shadow:0 25px 80px #000e}.profile-card h2{color:#f3d28d;margin:0 0 6px}.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.profile-option{border:1px solid #ffffff1c;background:#0c1721;border-radius:16px;padding:10px;text-align:center;color:#fff;cursor:pointer}.profile-option.selected{border-color:#e0b65f;box-shadow:0 0 0 2px #e0b65f55}.profile-avatar{width:68px;height:68px;margin:auto;border-radius:50%;border:2px solid #c59b53;background:linear-gradient(145deg,#314b62,#111923);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}.profile-avatar.ariyan{background-image:url('https://cdn.openart.ai/openart-uploads/production/attachment-transfers/5e1ebf60e4fb2011301965b7c1d1b755e0d8e781c67864e6e62e6a8d36766ec2.png');background-size:650px auto;background-position:left top}.profile-option b{display:block;margin-top:7px;color:#f0d59b}.profile-option small{color:#aebbc4}.profile-mini{display:inline-flex;align-items:center;gap:7px;cursor:pointer}.profile-mini .mini-avatar{width:30px;height:30px;border-radius:50%;border:1px solid #c59b53;background:#243746;display:inline-flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden}.profile-mini .mini-avatar.ariyan{background-image:url('https://cdn.openart.ai/openart-uploads/production/attachment-transfers/5e1ebf60e4fb2011301965b7c1d1b755e0d8e781c67864e6e62e6a8d36766ec2.png');background-size:300px auto;background-position:left top}@media(max-width:650px){.profile-grid{grid-template-columns:repeat(2,1fr)}}

<script>
const state={profile:null,wood:1200,stone:900,food:1500,iron:600,gold:320,honor:0,hero:1,energy:100,castle:1,territories:1,alliance:false,night:false,season:1,weather:'صاف',treasures:0,peace:0,npcTrust:0,style:'کلاسیک',fame:0,pass:false,vip:false,skins:0,seasonTokens:0,invites:0,eventTickets:0,loginDays:1,productionBuildings:12,troops:{infantry:40,cavalry:25,archers:35,spearmen:30},audio:{enabled:true,started:false},buildingLevels:{castle:1,wall:1,cityHall:1,treasury:1,barracks:1,stable:1,range:1,university:1,clinic:1,siege:1,market:1,spearmen:1,prodFarm:1,prodWood:1,prodStone:1,prodIron:1},automation:{dailyClaimed:false,passive:true,autoEvents:true,autoRotation:true,adReady:true,seasonProgress:0,lastTick:Date.now()},monetization:{skins:0,passes:0,vip:false,eventTickets:0,adRewards:0,referrals:0,shopCycle:1,offers:0}};
const $=id=>document.getElementById(id);
const SAVE_KEY='ashen_realms_save_v1';
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){}}
function loadGame(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return;const saved=JSON.parse(raw);Object.assign(state,saved);state.buildingLevels=Object.assign({},state.buildingLevels,saved.buildingLevels||{});state.automation=Object.assign({},state.automation,saved.automation||{});state.monetization=Object.assign({},state.monetization,saved.monetization||{});}catch(e){}}


const PROFILE_LIST=[
 {id:'ariyan',name:'KingAriyan',skin:'سلطنتی آبی',icon:'👑',cls:'ariyan'},
 {id:'alina',name:'Queen Alina',skin:'نگهبان سپیده',icon:'🦅'},
 {id:'darian',name:'Lord Darian',skin:'فرمانروای سنگ',icon:'🛡️'},
 {id:'soren',name:'Soren',skin:'سوار مهتاب',icon:'🌙'},
 {id:'lyra',name:'Lyra',skin:'بانوی جنگل',icon:'🌿'},
 {id:'kael',name:'Kael',skin:'پادشاه آتش',icon:'🔥'}
];
function applyProfile(p){
 state.profile=p.id;
 $('profileName').textContent=p.name;
 const a=$('miniAvatar');a.textContent=p.icon;a.className='mini-avatar '+(p.cls||'');
}
function openProfilePicker(){
 const grid=$('profileGrid');grid.innerHTML='';
 const current=state.profile||'ariyan';
 PROFILE_LIST.forEach(p=>{
   const d=document.createElement('button');d.type='button';d.className='profile-option'+(p.id===current?' selected':'');
   d.innerHTML='<span class="profile-avatar '+(p.cls||'')+'">'+(p.cls==='ariyan'?'':p.icon)+'</span><b>'+p.name+'</b><small>'+p.skin+'</small>';
   d.onclick=()=>{applyProfile(p);grid.querySelectorAll('.profile-option').forEach(x=>x.classList.remove('selected'));d.classList.add('selected');};
   grid.appendChild(d);
 });
 $('profilePick').classList.add('show');
}
function initProfile(){
 const saved=PROFILE_LIST.find(p=>p.id===state.profile)||PROFILE_LIST[0];
 applyProfile(saved);
 if(!localStorage.getItem('ashen_profile_selected')) openProfilePicker();
}
$('profileMini').onclick=openProfilePicker;
$('profileConfirm').onclick=()=>{localStorage.setItem('ashen_profile_selected','1');$('profilePick').classList.remove('show');saveGame();msg('پروفایل '+$('profileName').textContent+' انتخاب شد.');};

function render(){['wood','stone','iron','food','gold','honor'].forEach(k=>$(k).textContent=Math.floor(state[k]));$('phase').textContent=(state.night?'🌙 شب':'☀️ روز')+' • فصل '+state.season+' • '+(state.automation.passive?'⚙️ خودکار':'⏸️ متوقف');saveGame();}
function levelVisual(l){return 'ظاهر اختصاصی سطح '+l+' • '+(l<=10?'چوب و سنگ':l<=20?'سنگ‌کاری':l<=30?'قلعه‌سازی پیشرفته':l<=40?'معماری سلطنتی':'معماری افسانه‌ای')+' • جزئیات ظاهری + سطح قدرت '+l;}
function troopStats(l){return {hp:l*100,attack:l*12,defense:l*10,climb:l*8,speed:l*7,maneuver:l*9};}
function troopCard(name,icon,key){const b=state.buildingLevels[key]||1;const l=Math.min(15,Math.ceil(b/4));const s=troopStats(l);return '<div class="tile"><b>'+icon+' '+name+'</b><span>نیرو سطح '+l+'/15</span><br>❤️ جان '+s.hp+' • ⚔️ قدرت '+s.attack+'<br>🛡️ دفاع '+s.defense+' • 🧗 کوه‌نوردی '+s.climb+'<br>💨 سرعت '+s.speed+' • 🔄 مانورپذیری '+s.maneuver+'</div>';}
function buildingCard(key,name,icon){const l=state.buildingLevels[key]||1;return '<div class="tile"><b>'+icon+' '+name+'</b><span>سطح '+l+'/50</span><br><small>'+levelVisual(l)+'</small></div>';}
function upgradeBuilding(key,name){buildingSound(key);const l=state.buildingLevels[key]||1;if(l>=50){msg(name+' به حداکثر سطح ۵۰ رسیده است.');return;}const cost={wood:Math.ceil(60+l*18),stone:Math.ceil(45+l*15),gold:Math.ceil(10+l*3)};if(spend(cost)){state.buildingLevels[key]=l+1;state.honor+=2;render();msg(name+' به سطح '+(l+1)+' ارتقا یافت؛ ظاهر آن تغییر کرد.');}else msg('منابع کافی نیست.');}
function spend(cost){for(const k in cost)if(state[k]<cost[k])return false;for(const k in cost)state[k]-=cost[k];return true}
function systems24(){return [
'🧬 درخت فناوری: شاخه‌های اقتصاد، دفاع، توسعه و نیروها با پژوهش مرحله‌ای',
'👨‍✈️ فرماندهان: فرماندهان با نقش‌ها و مهارت‌های متفاوت برای مدیریت نیروها',
'🗺️ مناطق جهان: جنگل، کوهستان، دشت، رودخانه و برف با ویژگی‌های متفاوت',
'🏰 دفاع چندلایه شهر: دیوار، دروازه، برج و مرکز شهر',
'🍞 تأمین نیرو: فعالیت نیروها به منابع و آمادگی وابسته است',
'🏅 دستاوردها: اهداف بلندمدت با نشان و پاداش',
'📜 کمپین داستانی: فصل‌های داستانی با مأموریت‌های متوالی',
'🧑‍🤝‍🧑 دوستان: فهرست دوستان و فعالیت‌های مشترک',
'💬 چت اتحاد و جهان: ارتباط اجتماعی در نسخه آنلاین',
'🏛️ شورای پادشاهی: مشاوران با پیشنهادهای متفاوت',
'🎒 تجهیزات قهرمان: مجموعه آیتم‌های فانتزی و قابل ارتقا',
'🌟 مهارت‌های قهرمان: درخت مهارت با مسیرهای انتخابی',
'⚔️ آرایش نیروها: انتخاب ترکیب و نقش واحدها پیش از نبرد',
'🏳️ دیپلماسی: پیمان، تجارت، مذاکره و روابط قلمروها',
'💱 بازار بازیکنان: اقتصاد مبادله‌ای در نسخه آنلاین',
'🚚 کاروان تجارت: جابه‌جایی منابع بین مناطق',
'🏆 لیگ پادشاهان: رقابت‌های چندسطحی و رتبه‌بندی',
'📊 پروفایل پادشاه: تاریخچه، افتخارات و آمار',
'🌦️ رویدادهای محیطی: تغییرات آب‌وهوا و اتفاقات منطقه‌ای',
'🏗️ تغییر واقعی شهر: ارتقای ساختمان‌ها با تغییرات ظاهری',
'🎬 صحنه‌های سینمایی: نمایش رویدادهای مهم داستان',
'🧩 معما و اکتشاف: مأموریت‌های غیرنبردی و کشف مسیرها',
'🏛️ تالار تاریخ پادشاهی: ثبت رویدادهای مهم',
'🔄 جهان پویا: رویدادها و وضعیت مناطق با گذر فصل‌ها تغییر می‌کند'
];}
function open24(){show('systems24');}


/* CITY ECONOMY + AUDIO: production buildings live outside the walls. */
const PRODUCTION_TYPES={
  prodFarm:{name:'مزرعه',icon:'🌾',resource:'food',rate:3,sound:220},
  prodWood:{name:'کارگاه چوب',icon:'🪵',resource:'wood',rate:2,sound:280},
  prodStone:{name:'معدن سنگ',icon:'🪨',resource:'stone',rate:2,sound:190},
  prodIron:{name:'معدن آهن',icon:'⛏️',resource:'iron',rate:1,sound:150}
};
function productionCounts(){
  const total=Math.max(0,Math.min(30,state.productionBuildings||0));
  const base=Math.floor(total/4), rem=total%4;
  return {prodFarm:base+(rem>0),prodWood:base+(rem>1),prodStone:base+(rem>2),prodIron:base};
}
function productionOutput(){
  const c=productionCounts(), out={food:0,wood:0,stone:0,iron:0};
  Object.keys(PRODUCTION_TYPES).forEach(k=>{
    const type=PRODUCTION_TYPES[k], level=state.buildingLevels[k]||1;
    out[type.resource]=(c[k]||0)*type.rate*(1+level*.04);
  });
  return out;
}
function troopProductionTick(){
  const queues=[
    ['barracks','infantry',2],['stable','cavalry',1],['range','archers',2],['spearmen','spearmen',2]
  ];
  queues.forEach(([key,troop,base])=>{
    const level=state.buildingLevels[key]||1;
    const amount=Math.max(1,Math.floor(base+level/10));
    state.troops[troop]=(state.troops[troop]||0)+amount;
  });
}
function ensureAudio(){
  if(!state.audio.enabled || state.audio.started) return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const ac=new C(); state.audio.started=true; window.__ashenAudio=ac;
    const gain=ac.createGain();gain.gain.value=.035;gain.connect(ac.destination);
    const buffer=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate), data=buffer.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*.28;
    const src=ac.createBufferSource();src.buffer=buffer;src.loop=true;
    const filter=ac.createBiquadFilter();filter.type='lowpass';filter.frequency.value=950;
    src.connect(filter);filter.connect(gain);src.start();
    window.__waterGain=gain; window.__waterFilter=filter;
  }catch(e){}
}
function buildingSound(kind){
  ensureAudio(); const ac=window.__ashenAudio;if(!ac||!state.audio.enabled)return;
  const freq=PRODUCTION_TYPES[kind]?.sound||({castle:120,market:360,university:520,barracks:180,stable:240,range:430,clinic:300,siege:150}[kind]||260);
  const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.07,ac.currentTime+.02);
  g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.28);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.3);
}
function productionStatus(){
  const c=productionCounts(),o=productionOutput();
  return '<div class="tile"><b>🏭 تولید بیرون قلعه</b> '+state.productionBuildings+'/30 ساختمان فعال</div>'+
    '<div class="grid">'+Object.keys(PRODUCTION_TYPES).map(k=>{const t=PRODUCTION_TYPES[k];return '<div class="tile"><b>'+t.icon+' '+t.name+'</b>'+c[k]+' ساختمان • '+Math.floor(c[k]*t.rate*(1+(state.buildingLevels[k]||1)*.04))+' '+t.resource+' / دقیقه</div>';}).join('')+'</div>'+
    '<div class="tile"><b>⚔️ تولید نیرو</b> 🗡️ '+state.troops.infantry+' • 🐎 '+state.troops.cavalry+' • 🏹 '+state.troops.archers+' • 🔱 '+state.troops.spearmen+'</div>';
}

// AUTO-OPS: gameplay/retention loops run locally without manual administration.
function automationTick(){
  const a=state.automation; const m=state.monetization;
  if(a.passive){
    const o=productionOutput();
    state.food+=Math.floor(o.food/6); state.wood+=Math.floor(o.wood/6); state.stone+=Math.floor(o.stone/6); state.iron+=Math.floor(o.iron/6);
    state.gold+=Math.floor((state.buildingLevels.market||1)/20);
    state.energy=Math.min(100,state.energy+1);
    state.automation.seasonProgress+=1;
    if(state.automation.seasonProgress>=100){state.automation.seasonProgress=0;state.season++;state.seasonTokens+=10;state.fame+=3;}
  }
  if(a.autoEvents && Math.random()<0.08){state.eventTickets=Math.min(3,state.eventTickets+1);state.honor+=1;}
  if(a.autoRotation && Math.random()<0.05){m.shopCycle++;m.offers++;state.seasonTokens+=1;}
  if(state.automation.adReady===false) state.automation.adReady=true;
  render();
}
function dailyAutomation(){
  if(!state.automation.dailyClaimed){
    state.loginDays++;
    state.gold+=25;
    state.seasonTokens+=2;
    state.automation.dailyClaimed=true;
  }
}
function resetDailyAutomation(){
  state.automation.dailyClaimed=false;
}
setInterval(automationTick,60000);setInterval(troopProductionTick,20000);
setInterval(()=>{resetDailyAutomation();dailyAutomation();},86400000);
dailyAutomation();

function extraFeatures(){return {

async function startRealPayment(productId){
  msg('در حال ساخت سفارش پرداخت...');
  try{
    const r=await fetch('/api/create-order',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({productId,playerId:getPlayerId()})
    });
    const data=await r.json();
    if(!r.ok || !data.paymentUrl) throw new Error(data.message||'سرویس پرداخت هنوز پیکربندی نشده است.');
    window.location.href=data.paymentUrl;
  }catch(e){
    msg('پرداخت واقعی هنوز فعال نشده: '+e.message);
  }
}
function getPlayerId(){
  let id=localStorage.getItem('ashen_player_id');
  if(!id){id='player_'+crypto.randomUUID();localStorage.setItem('ashen_player_id',id);}
  return id;
}
function showPaymentStatus(){
  msg('سیستم پرداخت آزمایشی آماده است؛ تراکنش واقعی هنوز به درگاه قانونی متصل نیست.');
}
function simulatePayment(productId){
  const names={season_pass:'Season Pass',cosmetic_skin:'آیتم ظاهری'};
  const order='TEST-'+Date.now().toString(36).toUpperCase();
  const amount=productId==='season_pass'?'قیمت آزمایشی':'قیمت آزمایشی';
  $('body').innerHTML='<p class="muted">این صفحه فقط شبیه‌ساز پرداخت توسعه است و هیچ پول واقعی جابه‌جا نمی‌کند.</p><div class="tile"><b>🧾 سفارش</b>'+order+'<br>محصول: '+(names[productId]||productId)+'<br>مبلغ: '+amount+'</div>';
  $('actions').innerHTML='';
  action('✅ شبیه‌سازی پرداخت موفق',()=>{
    if(productId==='season_pass'){state.pass=true;state.seasonTokens+=20;}
    if(productId==='cosmetic_skin'){state.skins++;}
    state.monetization.passes += productId==='season_pass'?1:0;
    state.monetization.skins += productId==='cosmetic_skin'?1:0;
    render(); msg('پرداخت آزمایشی موفق شد؛ سفارش '+order+' ثبت شد. هیچ مبلغ واقعی دریافت نشده است.');
  });
  action('❌ شبیه‌سازی پرداخت ناموفق',()=>msg('پرداخت آزمایشی ناموفق شد؛ هیچ آیتمی فعال نشد.'));
  action('↩️ شبیه‌سازی لغو',()=>msg('پرداخت آزمایشی لغو شد؛ هیچ آیتمی فعال نشد.'));
}

  action(state.alliance?'✅ اتحاد فعال':'🤝 ساخت اتحاد',()=>{state.alliance=true;state.honor+=10;render();msg('اتحاد فعال شد؛ رویدادهای گروهی آماده‌اند.');});
 }else if(kind==='settings'){
 $('body').innerHTML+=productionStatus()+'<div class="grid"><div class="tile"><b>🔊 صدا</b><span id="soundStatus">روشن</span></div><div class="tile"><b>🔔 اعلان‌ها</b><span id="notifyStatus">روشن</span></div><div class="tile"><b>🎨 کیفیت تصویر</b><span id="qualityStatus">بالا</span></div><div class="tile"><b>🎮 کنترل‌ها</b>استاندارد</div><div class="tile"><b>🌐 زبان</b>فارسی</div><div class="tile"><b>📱 حالت نمایش</b>تمام‌صفحه</div></div>';
 action('🔊 روشن/خاموش کردن صدا',()=>{state.audio.enabled=!state.audio.enabled;ensureAudio();if(window.__waterGain)window.__waterGain.gain.value=state.audio.enabled?.035:0;const e=$('soundStatus');e.textContent=state.audio.enabled?'روشن':'خاموش';msg(state.audio.enabled?'صدای آبشار و صدای ساختمان‌ها روشن شد.':'همه صداها خاموش شد.');});
 action('🔔 اعلان‌ها',()=>{const e=$('notifyStatus');e.textContent=e.textContent==='روشن'?'خاموش':'روشن';msg('تنظیم اعلان‌ها ذخیره شد.');});
 action('🎨 تغییر کیفیت تصویر',()=>{const e=$('qualityStatus');e.textContent=e.textContent==='بالا'?'متوسط':'بالا';msg('کیفیت تصویر تغییر کرد.');});
 action('🌐 انتخاب زبان',()=>{msg('بخش انتخاب زبان آماده توسعه برای زبان‌های بیشتر است.');});
 action('🎮 تنظیم کنترل‌ها',()=>{msg('کنترل‌های بازی قابل شخصی‌سازی هستند.');});
 action('🔒 حریم خصوصی',()=>{msg('تنظیمات حریم خصوصی و حساب در این بخش قرار می‌گیرد.');});
 action('💾 ذخیره بازی',()=>{saveGame();msg('ذخیره محلی انجام شد.');});
 action('ℹ️ وضعیت نسخه',()=>{msg('Ashen Realms • نسخه آماده توسعه موبایل • پرداخت واقعی عمداً هنوز متصل نشده است.');});
}else if(kind==='shop'){
 $('body').innerHTML+='<div class="tile"><b>⚙️ موتور خودکار</b>تولید منابع، پاداش روزانه، چرخش فروشگاه و رویدادهای فصلی بدون مدیریت دستی اجرا می‌شوند.</div>'+'<div class="grid"><div class="tile"><b>🎟️ Season Pass</b>پاداش‌های فصلی</div><div class="tile"><b>👑 Royal Pass</b>مأموریت‌های ویژه</div><div class="tile"><b>🎨 فروشگاه ظاهری</b>اسکین و تزئینات</div><div class="tile"><b>📺 تبلیغ اختیاری</b>پاداش انتخابی</div><div class="tile"><b>🏆 فروشگاه فصل</b>آیتم‌های فصلی</div><div class="tile"><b>🤝 بسته اتحاد</b>امکانات اجتماعی</div><div class="tile"><b>🐉 رویداد محدود</b>جایزه ویژه</div><div class="tile"><b>⭐ VIP</b>امکانات رفاهی</div><div class="tile"><b>🎟️ بلیت رویداد</b>ورود به رویداد</div><div class="tile"><b>📅 ورود ۳۰روزه</b>پاداش روزانه</div></div>';
 action('🧪 پرداخت آزمایشی Season Pass',()=>simulatePayment('season_pass'));
  action('🧪 پرداخت آزمایشی آیتم ظاهری',()=>simulatePayment('cosmetic_skin'));
  action('🔐 وضعیت اتصال پرداخت',showPaymentStatus);
  action('🎟️ فعال‌سازی Season Pass',()=>{state.pass=true;state.seasonTokens+=20;render();msg('Season Pass فعال شد؛ ۲۰ توکن فصل دریافت شد.');});
 action('🎨 دریافت آیتم ظاهری',()=>{state.skins++;render();msg('یک آیتم ظاهری جدید به مجموعه اضافه شد.');});
 action('📺 تماشای تبلیغ اختیاری',()=>{state.gold+=35;state.seasonTokens+=3;render();msg('پاداش تبلیغ اختیاری: ۳۵ طلا و ۳ توکن فصل.');});
 action('🏆 فروشگاه فصل',()=>{if(state.seasonTokens>=5){state.seasonTokens-=5;state.skins++;render();msg('یک آیتم فصلی دریافت شد.');}else msg('توکن فصل کافی نیست.');});
 action('⭐ فعال‌سازی VIP',()=>{state.vip=true;state.honor+=5;render();msg('VIP آزمایشی فعال شد؛ فقط امکانات رفاهی دارد.');});
 action('🤝 بسته اتحاد',()=>{state.alliance=true;state.honor+=6;render();msg('محتوای اجتماعی اتحاد فعال شد.');});
 action('🐉 بلیت رویداد',()=>{if(state.eventTickets<3){state.eventTickets++;state.honor+=4;render();msg('یک بلیت رویداد دریافت شد.');}else msg('سقف بلیت این رویداد پر شده است.');});
 action('📅 پاداش ورود امروز',()=>{state.loginDays++;state.gold+=20;render();msg('پاداش ورود امروز دریافت شد.');});
 action('👥 دعوت دوستان',()=>{state.invites++;state.honor+=3;render();msg('دعوت ثبت شد؛ در نسخه آنلاین پاداش دعوت اعمال می‌شود.');});
 action('🎁 بسته مناسبتی',()=>{state.gold+=50;state.seasonTokens+=5;render();msg('بسته مناسبتی نمونه دریافت شد.');});
 action('⚙️ فعال/غیرفعال کردن تولید خودکار',()=>{state.automation.passive=!state.automation.passive;render();msg(state.automation.passive?'تولید خودکار فعال شد.':'تولید خودکار متوقف شد.');});
 action('🔄 چرخش خودکار فروشگاه',()=>{state.automation.autoRotation=!state.automation.autoRotation;render();msg(state.automation.autoRotation?'چرخش خودکار پیشنهادها فعال شد.':'چرخش خودکار پیشنهادها متوقف شد.');});
 action('🎉 رویدادهای خودکار',()=>{state.automation.autoEvents=!state.automation.autoEvents;render();msg(state.automation.autoEvents?'رویدادهای خودکار فعال شد.':'رویدادهای خودکار متوقف شد.');});
 action('📅 دریافت پاداش روزانه',()=>{if(state.automation.dailyClaimed)msg('پاداش امروز قبلاً دریافت شده است.');else{dailyAutomation();render();msg('پاداش روزانه به‌صورت خودکار ثبت شد.');}});
 action('📈 وضعیت درآمدزایی خودکار',()=>{msg('Pass: '+(state.pass?'فعال':'غیرفعال')+' • VIP: '+(state.vip?'فعال':'غیرفعال')+' • اسکین: '+state.skins+' • تبلیغ: '+state.monetization.adRewards+' • چرخه فروشگاه: '+state.monetization.shopCycle);});
}else if(kind==='quest'){
  action('🌅 انتخاب صلح',()=>{state.food+=250;state.honor+=5;render();msg('پاداش صلح: ۲۵۰ غذا و ۵ شهرت.');});
  action('🔥 انتخاب ریسک',()=>{state.gold+=140;state.honor+=12;render();msg('پاداش ریسک: ۱۴۰ طلا و ۱۲ شهرت.');});
 }
 $('panel').classList.add('show');
}
function action(label,fn){const b=document.createElement('button');b.className='btn';b.textContent=label;b.type='button';b.onclick=fn;$('actions').appendChild(b)}
function msg(t){$('log').textContent=t}
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.open)));
[['hCity','city'],['hWorld','world'],['hBattle','combat'],['hHero','hero'],['hInv','city'],['hAlliance','alliance']].forEach(([id,k])=>$(id).addEventListener('click',()=>show(k)));
$('close').onclick=()=>$('panel').classList.remove('show');
$('panel').addEventListener('click',e=>{if(e.target===$('panel'))$('panel').classList.remove('show')});
loadGame();
render();
initProfile();
</script>
</body></html>
